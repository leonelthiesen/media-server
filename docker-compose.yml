version: '3.8'

services:
  # qBittorrent - BitTorrent client
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT:-8080}
    volumes:
      - ${CONFIG_PATH:-./config}/qbittorrent:/config
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
    ports:
      - ${QBITTORRENT_WEBUI_PORT:-8080}:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    networks:
      - media-network

  # Jackett - Indexer proxy/translation
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - AUTO_UPDATE=true
    volumes:
      - ${CONFIG_PATH:-./config}/jackett:/config
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
    ports:
      - 9117:9117
    restart: unless-stopped
    networks:
      - media-network

  # FlareSolverr - Cloudflare bypass
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ:-Etc/UTC}
    ports:
      - 8191:8191
    restart: unless-stopped
    networks:
      - media-network

  # Radarr - Movie management
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_PATH:-./config}/radarr:/config
      - ${MOVIES_PATH:-./media/movies}:/movies
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      - media-network
    depends_on:
      - qbittorrent
      - jackett

  # Sonarr - TV show management
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_PATH:-./config}/sonarr:/config
      - ${TV_PATH:-./media/tv}:/tv
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - media-network
    depends_on:
      - qbittorrent
      - jackett

  # Bazarr - Subtitle management
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_PATH:-./config}/bazarr:/config
      - ${MOVIES_PATH:-./media/movies}:/movies
      - ${TV_PATH:-./media/tv}:/tv
    ports:
      - 6767:6767
    restart: unless-stopped
    networks:
      - media-network
    depends_on:
      - radarr
      - sonarr

  # Plex - Media server
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - VERSION=docker
    volumes:
      - ${CONFIG_PATH:-./config}/plex:/config
      - ${TV_PATH:-./media/tv}:/tv
      - ${MOVIES_PATH:-./media/movies}:/movies
    ports:
      - 32400:32400
      - 1900:1900/udp
      - 3005:3005
      - 5353:5353/udp
      - 8324:8324
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
      - 32469:32469
    restart: unless-stopped
    networks:
      - media-network

networks:
  media-network:
    driver: bridge
